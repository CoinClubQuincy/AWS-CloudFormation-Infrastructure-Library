AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  CodePipeline sourced from CodeCommit that deploys a CloudFormation template from the repository
  (Source -> Deploy, no build stage). The pipeline role is scoped to the resources this stack creates;
  what the deployed stack may create is set by the managed policies passed in DeployPolicyArns.
Parameters:
  AppName:
    Type: String
    Description: Name of the application (lowercase; also used for the repository, pipeline and bucket names)
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,40}[a-z0-9]$'
  BranchName:
    Type: String
    Default: main
    Description: Branch that triggers the pipeline
  TemplatePath:
    Type: String
    Default: template.yaml
    Description: Path of the CloudFormation template inside the repository
  DeployStackName:
    Type: String
    Description: Name of the stack the pipeline creates and updates
    AllowedPattern: '^[a-zA-Z][-a-zA-Z0-9]{0,127}$'
  DeployPolicyArns:
    Type: CommaDelimitedList
    Description: >-
      Managed policy ARNs that CloudFormation may use when deploying the stack. Grant only what the
      deployed template creates.

Resources:
  MyArtifactStoreBucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: !Sub '${AppName}-artifact-store'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MyCodeCommitRepository:
    Type: AWS::CodeCommit::Repository
    Properties:
      RepositoryName: !Ref AppName
      RepositoryDescription: !Sub 'My CodeCommit repository for the ${AppName} application'

  # The role CloudFormation assumes to create/update the deployed stack.
  CloudFormationDeployRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${AppName}-cloudformation-deploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns: !Ref DeployPolicyArns

  CodePipelineServiceRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: !Sub '${AppName}-codepipeline-service'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - 'codepipeline.amazonaws.com'
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: CodePipelinePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:GetObjectVersion'
                  - 's3:PutObject'
                Resource: !Sub '${MyArtifactStoreBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - 's3:GetBucketVersioning'
                  - 's3:GetBucketLocation'
                Resource: !GetAtt MyArtifactStoreBucket.Arn
              - Effect: Allow
                Action:
                  - 'codecommit:GetBranch'
                  - 'codecommit:GetCommit'
                  - 'codecommit:GetRepository'
                  - 'codecommit:UploadArchive'
                  - 'codecommit:GetUploadArchiveStatus'
                  - 'codecommit:CancelUploadArchive'
                Resource: !GetAtt MyCodeCommitRepository.Arn
              - Effect: Allow
                Action:
                  - 'cloudformation:CreateStack'
                  - 'cloudformation:UpdateStack'
                  - 'cloudformation:DeleteStack'
                  - 'cloudformation:DescribeStacks'
                  - 'cloudformation:CreateChangeSet'
                  - 'cloudformation:DescribeChangeSet'
                  - 'cloudformation:ExecuteChangeSet'
                  - 'cloudformation:DeleteChangeSet'
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${DeployStackName}/*'
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CloudFormationDeployRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref AppName
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref MyArtifactStoreBucket
      Stages:
        - Name: Source
          Actions:
            - Name: SourceAction
              ActionTypeId:
                Category: Source
                Owner: AWS
                Version: '1'
                Provider: CodeCommit
              OutputArtifacts:
                - Name: SourceOutput
              Configuration:
                RepositoryName: !GetAtt MyCodeCommitRepository.Name
                BranchName: !Ref BranchName
                PollForSourceChanges: false
              RunOrder: 1
        - Name: Deploy
          Actions:
            - Name: DeployStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Version: '1'
                Provider: CloudFormation
              InputArtifacts:
                - Name: SourceOutput
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref DeployStackName
                TemplatePath: !Sub 'SourceOutput::${TemplatePath}'
                Capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
                RoleArn: !GetAtt CloudFormationDeployRole.Arn
              RunOrder: 1

  # PollForSourceChanges is off, so a branch push starts the pipeline through this rule.
  SourceChangeEventRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: StartPipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'codepipeline:StartPipelineExecution'
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'

  SourceChangeRule:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !GetAtt MyCodeCommitRepository.Arn
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref BranchName
      Targets:
        - Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !GetAtt SourceChangeEventRole.Arn
          Id: codepipeline-source

Outputs:
  PipelineUrl:
    Description: URL of the created CodePipeline
    Value: !Sub "https://console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view"
  RepositoryCloneUrlHttp:
    Description: HTTPS clone URL of the CodeCommit repository
    Value: !GetAtt MyCodeCommitRepository.CloneUrlHttp
  DeployedStackName:
    Description: Stack the pipeline creates and updates
    Value: !Ref DeployStackName
