AWSTemplateFormatVersion: '2010-09-09'
Description: ECS Fargate service with roles, logs, a circuit breaker and optional load balancing and autoscaling.

Metadata:
  Library:
    Domain: containers
    Summary: ECS Fargate service with task definition, execution and task roles, log group, deployment circuit breaker with rollback, and optional load balancer attachment and CPU autoscaling.
    Cost: Bills for vCPU and memory while tasks run. Defaults to one small arm64 task, and Spot is cheaper but can be interrupted.
    Prerequisites:
      - A cluster from containers/ecs-cluster.yaml. Subnets with a route to the registry. A target group already attached to a listener if you use TargetGroupArn.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Identity}
        Parameters: [ProjectName, Environment]
      - Label: {default: Service}
        Parameters: [ClusterName, Image, ContainerPort, DesiredCount, UseSpot]
      - Label: {default: Task}
        Parameters: [Cpu, Memory, CpuArchitecture, TaskPolicyArn, AppConfigValue]
      - Label: {default: Network}
        Parameters: [VpcId, SubnetIds, SourceSecurityGroupId, AdditionalSecurityGroupId]
      - Label: {default: Load balancing}
        Parameters: [TargetGroupArn]
      - Label: {default: Scaling}
        Parameters: [EnableAutoScaling, MinTasks, MaxTasks, TargetCpuPercent]
      - Label: {default: Logs}
        Parameters: [LogRetentionDays]

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project name, used for tags. Lowercase letters, digits and hyphens.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment, used for tags.
  ClusterName:
    Type: String
    Description: Name of the ECS cluster.
  Image:
    Type: String
    Description: Container image URI.
  ContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: Port the container listens on.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Tasks to run.
  UseSpot:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Run on Fargate Spot, which is cheaper but can be interrupted.
  Cpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: Task CPU units. Must pair validly with Memory.
  Memory:
    Type: String
    Default: '512'
    Description: Task memory in MiB. Must pair validly with Cpu.
  CpuArchitecture:
    Type: String
    Default: ARM64
    AllowedValues: [ARM64, X86_64]
    Description: Must match the image. ARM64 costs less.
  TaskPolicyArn:
    Type: String
    Default: ''
    Description: Optional managed policy granting what the application needs.
  AppConfigValue:
    Type: String
    Default: ''
    Description: Optional non-secret value exposed to the container as APP_CONFIG, such as a secret ARN to look up.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the tasks.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for the tasks. Use private subnets.
  SourceSecurityGroupId:
    Type: String
    Default: ''
    Description: Optional security group allowed to reach ContainerPort, such as the load balancer's.
  AdditionalSecurityGroupId:
    Type: String
    Default: ''
    Description: Optional extra security group for the tasks, such as one a database trusts.
  TargetGroupArn:
    Type: String
    Default: ''
    Description: Optional target group. Its target type must be ip.
  EnableAutoScaling:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Scale on average CPU.
  MinTasks:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Minimum tasks when autoscaling.
  MaxTasks:
    Type: Number
    Default: 4
    MinValue: 1
    Description: Maximum tasks when autoscaling.
  TargetCpuPercent:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 90
    Description: Average CPU the service scales to hold.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
    Description: Days to keep container logs.

Conditions:
  Spot: !Equals [!Ref UseSpot, 'true']
  HasSource: !Not [!Equals [!Ref SourceSecurityGroupId, '']]
  HasTargetGroup: !Not [!Equals [!Ref TargetGroupArn, '']]
  HasTaskPolicy: !Not [!Equals [!Ref TaskPolicyArn, '']]
  HasAppConfig: !Not [!Equals [!Ref AppConfigValue, '']]
  HasExtraSecurityGroup: !Not [!Equals [!Ref AdditionalSecurityGroupId, '']]
  AutoScaling: !Equals [!Ref EnableAutoScaling, 'true']

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If [HasTaskPolicy, !Ref TaskPolicyArn, !Ref AWS::NoValue]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Fargate service tasks.
      VpcId: !Ref VpcId
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  SourceIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSource
    Properties:
      GroupId: !Ref SecurityGroup
      Description: Allow from the configured security group
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref SourceSecurityGroupId

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      RuntimePlatform:
        CpuArchitecture: !Ref CpuArchitecture
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Ref Image
          Essential: true
          Environment: !If
            - HasAppConfig
            - - {Name: APP_CONFIG, Value: !Ref AppConfigValue}
            - !Ref AWS::NoValue
          PortMappings:
            - {ContainerPort: !Ref ContainerPort, Protocol: tcp}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref ClusterName
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      CapacityProviderStrategy:
        - CapacityProvider: !If [Spot, FARGATE_SPOT, FARGATE]
          Weight: 1
      PropagateTags: SERVICE
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: !If [HasTargetGroup, 60, !Ref AWS::NoValue]
      LoadBalancers: !If
        - HasTargetGroup
        - - ContainerName: app
            ContainerPort: !Ref ContainerPort
            TargetGroupArn: !Ref TargetGroupArn
        - !Ref AWS::NoValue
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: !If
            - HasExtraSecurityGroup
            - [!Ref SecurityGroup, !Ref AdditionalSecurityGroupId]
            - [!Ref SecurityGroup]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Condition: AutoScaling
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${ClusterName}/${Service.Name}'
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Condition: AutoScaling
    Properties:
      PolicyName: !Sub '${AWS::StackName}-cpu'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref TargetCpuPercent

Outputs:
  ServiceName:
    Description: Service name.
    Value: !GetAtt Service.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'
  SecurityGroupId:
    Description: Task security group.
    Value: !Ref SecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'
  TaskRoleName:
    Description: Task role name.
    Value: !Ref TaskRole
    Export:
      Name: !Sub '${AWS::StackName}-TaskRoleName'
  TaskRoleArn:
    Description: Task role ARN.
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TaskRoleArn'
  LogGroupName:
    Description: Log group name.
    Value: !Ref LogGroup
    Export:
      Name: !Sub '${AWS::StackName}-LogGroupName'
