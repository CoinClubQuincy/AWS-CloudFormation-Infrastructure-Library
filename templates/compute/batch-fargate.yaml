AWSTemplateFormatVersion: '2010-09-09'
Description: AWS Batch on Fargate, with a compute environment, job queue and job definition.

Metadata:
  Library:
    Domain: compute
    Summary: AWS Batch on Fargate or Fargate Spot, with a compute environment, job queue, job definition and log group.
    Cost: No idle charge. Fargate bills only while jobs run, and Spot is cheaper but can be interrupted.
    Prerequisites:
      - Subnets with a route to your container registry, and a container image.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Identity}
        Parameters: [ProjectName, Environment]
      - Label: {default: Job}
        Parameters: [Image, Vcpu, MemoryMiB, JobRolePolicyArn, AttemptDurationSeconds]
      - Label: {default: Compute}
        Parameters: [CapacityType, MaxVcpus, VpcId, SubnetIds]

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project name, used for tags. Lowercase letters, digits and hyphens.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment, used for tags.
  Image:
    Type: String
    Description: Container image URI.
  Vcpu:
    Type: String
    Default: '0.25'
    AllowedValues: ['0.25', '0.5', '1', '2', '4']
    Description: vCPUs per job. Must pair validly with MemoryMiB under Fargate rules.
  MemoryMiB:
    Type: String
    Default: '512'
    Description: Memory per job in MiB. Must pair validly with Vcpu under Fargate rules.
  JobRolePolicyArn:
    Type: String
    Default: ''
    Description: Optional managed policy granting what the job needs.
  AttemptDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    Description: Timeout per job attempt.
  CapacityType:
    Type: String
    Default: FARGATE_SPOT
    AllowedValues: [FARGATE, FARGATE_SPOT]
    Description: FARGATE_SPOT is cheaper but jobs can be interrupted.
  MaxVcpus:
    Type: Number
    Default: 16
    MinValue: 1
    Description: Upper limit on concurrent vCPUs, which also caps spend.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for jobs.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets for jobs.

Conditions:
  HasJobPolicy: !Not [!Equals [!Ref JobRolePolicyArn, '']]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Batch jobs, with no inbound access.
      VpcId: !Ref VpcId
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  JobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If [HasJobPolicy, !Ref JobRolePolicyArn, !Ref AWS::NoValue]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      State: ENABLED
      ComputeResources:
        Type: !Ref CapacityType
        MaxvCpus: !Ref MaxVcpus
        Subnets: !Ref SubnetIds
        SecurityGroupIds: [!Ref SecurityGroup]
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  JobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      Priority: 1
      State: ENABLED
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  JobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities: [FARGATE]
      PropagateTags: true
      Timeout:
        AttemptDurationSeconds: !Ref AttemptDurationSeconds
      RetryStrategy:
        Attempts: 2
      ContainerProperties:
        Image: !Ref Image
        ExecutionRoleArn: !GetAtt ExecutionRole.Arn
        JobRoleArn: !GetAtt JobRole.Arn
        ResourceRequirements:
          - {Type: VCPU, Value: !Ref Vcpu}
          - {Type: MEMORY, Value: !Ref MemoryMiB}
        NetworkConfiguration:
          AssignPublicIp: DISABLED
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref AWS::Region
            awslogs-stream-prefix: batch
      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment
        ManagedBy: CloudFormation

Outputs:
  JobQueueArn:
    Description: Job queue ARN.
    Value: !Ref JobQueue
    Export:
      Name: !Sub '${AWS::StackName}-JobQueueArn'
  JobDefinitionArn:
    Description: Job definition ARN.
    Value: !Ref JobDefinition
    Export:
      Name: !Sub '${AWS::StackName}-JobDefinitionArn'
