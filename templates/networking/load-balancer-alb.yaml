AWSTemplateFormatVersion: '2010-09-09'
Description: Application Load Balancer with HTTPS, an HTTP redirect and one target group.

Metadata:
  Library:
    Domain: networking
    Summary: Application Load Balancer with a TLS 1.3 HTTPS listener, HTTP-to-HTTPS redirect and an IP target group. Internal by default.
    Cost: Bills hourly plus per load balancer capacity unit, whether or not it receives traffic. Internet-facing schemes also bill for public IPv4 addresses.
    Prerequisites:
      - An ACM certificate in this region and subnets in at least two Availability Zones.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Identity}
        Parameters: [ProjectName, Environment]
      - Label: {default: Network}
        Parameters: [VpcId, SubnetIds, Scheme, AllowedCidr]
      - Label: {default: TLS}
        Parameters: [CertificateArn]
      - Label: {default: Target}
        Parameters: [TargetPort, TargetType, HealthCheckPath]
      - Label: {default: Operations}
        Parameters: [AccessLogBucketName, EnableDeletionProtection]

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project name, used for tags. Lowercase letters, digits and hyphens.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment, used for tags.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC for the load balancer.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnets in at least two Availability Zones. Use public subnets for internet-facing.
  Scheme:
    Type: String
    Default: internal
    AllowedValues: [internal, internet-facing]
    Description: Whether the load balancer is reachable from the internet.
  AllowedCidr:
    Type: String
    Description: CIDR allowed to reach ports 80 and 443. Pass 0.0.0.0/0 only for a deliberately public site.
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:[a-z-]+:acm:.+$'
    Description: ACM certificate ARN for the HTTPS listener.
  TargetPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
    Description: Port the targets listen on.
  TargetType:
    Type: String
    Default: ip
    AllowedValues: [ip, instance]
    Description: Use ip for Fargate and instance for Auto Scaling groups.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: Path that returns HTTP 200 when a target is healthy.
  AccessLogBucketName:
    Type: String
    Default: ''
    Description: Optional bucket for access logs. See storage/s3-log-bucket.yaml.
  EnableDeletionProtection:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Prevent deletion of the load balancer.

Conditions:
  UseAccessLogs: !Not [!Equals [!Ref AccessLogBucketName, '']]

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer listeners.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr, Description: Allow from the configured CIDR}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr, Description: Allow from the configured CIDR}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: !Ref Scheme
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref SecurityGroup]
      LoadBalancerAttributes:
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
        - {Key: deletion_protection.enabled, Value: !Ref EnableDeletionProtection}
        - {Key: access_logs.s3.enabled, Value: !If [UseAccessLogs, 'true', 'false']}
        - !If
          - UseAccessLogs
          - {Key: access_logs.s3.bucket, Value: !Ref AccessLogBucketName}
          - !Ref AWS::NoValue
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: !Ref TargetPort
      TargetType: !Ref TargetType
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

Outputs:
  LoadBalancerArn:
    Description: Load balancer ARN.
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerArn'
  LoadBalancerDnsName:
    Description: DNS name of the load balancer.
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerDnsName'
  CanonicalHostedZoneId:
    Description: Hosted zone ID for Route 53 alias records.
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub '${AWS::StackName}-CanonicalHostedZoneId'
  SecurityGroupId:
    Description: Load balancer security group. Allow it as the source on your targets.
    Value: !Ref SecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-SecurityGroupId'
  TargetGroupArn:
    Description: Target group ARN.
    Value: !Ref TargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-TargetGroupArn'
  HttpsListenerArn:
    Description: HTTPS listener ARN.
    Value: !Ref HttpsListener
    Export:
      Name: !Sub '${AWS::StackName}-HttpsListenerArn'
