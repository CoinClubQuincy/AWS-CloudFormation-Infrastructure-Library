AWSTemplateFormatVersion: '2010-09-09'
Description: Generated Secrets Manager secret with optional customer-managed key and resource policy.

Metadata:
  Library:
    Domain: security
    Summary: Secrets Manager secret whose value Secrets Manager generates, so it never passes through parameters, with optional customer-managed key and one reader principal.
    Cost: Bills monthly per secret plus per 10,000 API calls.
    Prerequisites:
      - none. This template does not rotate the value, which needs a rotation function.
    WildcardResources:
      ReaderPolicy: In a secret's resource policy, Resource must be * and means this secret.
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Identity}
        Parameters: [ProjectName, Environment]
      - Label: {default: Value}
        Parameters: [GeneratedLength, ExcludePunctuation, JsonUsername]
      - Label: {default: Access}
        Parameters: [KmsKeyArn, ReaderPrincipalArn]

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,30}$'
    Description: Project name, used for tags. Lowercase letters, digits and hyphens.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Deployment environment, used for tags.
  GeneratedLength:
    Type: Number
    Default: 32
    MinValue: 16
    MaxValue: 4096
    Description: Length of the generated value.
  ExcludePunctuation:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Exclude punctuation, for systems that reject it.
  JsonUsername:
    Type: String
    Default: ''
    Description: Optional username. When set, the secret is JSON with username and password keys.
  KmsKeyArn:
    Type: String
    Default: ''
    Description: Optional customer-managed KMS key. Needed for cross-account access.
  ReaderPrincipalArn:
    Type: String
    Default: ''
    Description: Optional IAM principal allowed to read the secret.

Conditions:
  HasUsername: !Not [!Equals [!Ref JsonUsername, '']]
  HasKms: !Not [!Equals [!Ref KmsKeyArn, '']]
  HasReader: !Not [!Equals [!Ref ReaderPrincipalArn, '']]

Resources:
  Secret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${ProjectName} ${Environment} generated secret'
      KmsKeyId: !If [HasKms, !Ref KmsKeyArn, !Ref AWS::NoValue]
      GenerateSecretString:
        PasswordLength: !Ref GeneratedLength
        ExcludePunctuation: !Ref ExcludePunctuation
        SecretStringTemplate: !If [HasUsername, !Sub '{"username":"${JsonUsername}"}', !Ref AWS::NoValue]
        GenerateStringKey: !If [HasUsername, password, !Ref AWS::NoValue]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: Environment, Value: !Ref Environment}
        - {Key: ManagedBy, Value: CloudFormation}

  ReaderPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Condition: HasReader
    Properties:
      SecretId: !Ref Secret
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {AWS: !Ref ReaderPrincipalArn}
            Action: secretsmanager:GetSecretValue
            Resource: '*'

Outputs:
  SecretArn:
    Description: Secret ARN.
    Value: !Ref Secret
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'
