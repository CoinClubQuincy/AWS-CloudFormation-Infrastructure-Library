name: validate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned so a new release cannot change the result without a commit here.
      - name: Install tools
        run: pip install cfn-lint==1.59.0 checkov==3.4.0

      # Any finding fails. These run separately because --ignore-checks on the command line
      # replaces ignores declared inside a template. W3002 flags the relative TemplateURL that
      # `aws cloudformation package` resolves, which is how blueprints are meant to deploy.
      - name: Lint templates (warnings block)
        run: cfn-lint --template 'templates/**/*.yaml'

      - name: Lint blueprints (warnings block)
        run: cfn-lint --ignore-checks W3002 --template 'blueprints/*.yaml'

      - name: Check library conventions and catalog
        run: python scripts/check_library.py

      - name: Check that the checker catches defects
        run: python scripts/test_checker.py

      - name: Security scan
        run: checkov -d templates --config-file .checkov.yaml

      # Unsupported originals: errors block, warnings do not.
      - name: Lint legacy templates
        run: |
          failed=0
          for f in $(find legacy \( -name '*.yaml' -o -name '*.yml' \) | sort); do
            rc=0
            out=$(cfn-lint "$f" 2>&1) || rc=$?
            case $rc in
              0|4|8|12) ;;
              *) echo "::error file=$f::cfn-lint exited $rc"; echo "$out"; failed=1 ;;
            esac
          done
          exit $failed
