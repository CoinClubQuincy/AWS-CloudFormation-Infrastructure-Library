AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  API Gateway REST API named after the stack. It has no resources, methods,
  deployment or stage, so add those before it can serve requests.
Parameters:
  ENVTag:
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
      - Test
    Description: Label Enviroment Tag
  VersionTag:
    Type: String
    Default: V.1
    Description: Label Version Tag
  ProjectTag:
    Type: String
    Description: Label ProjectTag

Resources:
  API:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name:
        Ref: AWS::StackName
      Tags:
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag
