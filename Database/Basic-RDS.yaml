AWSTemplateFormatVersion: '2010-09-09'
Description: RDS instance inside a VPC with a parameterised engine and size.
####  Notes
####  1.When launching RDS to connect you must specify 1 IP in RDS Security Groups
####  2.Enable Public accessibility in modify section


Parameters:
  DB:
    Type: String
    Default: MySQL
    AllowedValues:
      - MySQL
      - MariaDB
      - postgres
      - oracle-se2
      - sqlserver-ex
    Description: >-
      RDS engine. oracle-se2 is Oracle Standard Edition Two and sqlserver-ex is
      SQL Server Express. Aurora is not offered because it needs an
      AWS::RDS::DBCluster, which this template does not create.

  PrivateIP:
    Type: String
    Description: >-
      CIDR range allowed to reach the database ports (1521, 3306, 1433 and
      5432), for example 10.0.0.0/16. There is no default.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$'
    ConstraintDescription: must be an IPv4 CIDR block such as 10.0.0.0/16.

  AllocatedStorages:
    Type: String
    Default: "20"
    AllowedValues:
      - "20"
      - "50"
      - "100"
      - "400"
      - "600"
      - "800"
      - "1000"
    Description: Allocated storage in GiB (gp2 and gp3 need at least 20)

  AZ:
    Type: String
    Default: A
    AllowedValues:
      - A
      - B
      - C
    Description: >-
      Availability Zone for a Single-AZ instance. A, B and C are the first,
      second and third zones that Fn::GetAZs returns for the region. Pick the
      zone of Subnet1 or Subnet2. Ignored when MultiAZs is true.

  InstanceTypeParameter:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.t3.xlarge
      - db.t3.2xlarge
      - db.r4.large
      - db.r4.xlarge
      - db.r4.2xlarge
      - db.r4.4xlarge
      - db.r4.8xlarge
      - db.r4.16xlarge
      - db.m4.large
      - db.m4.xlarge
      - db.m4.2xlarge
      - db.m4.4xlarge
      - db.m4.10xlarge
      - db.m4.16xlarge
    Description: Chooses instance type

  VPC:
    Type: AWS::EC2::VPC::Id
    Description: VPC Identifier
    MinLength: 1

  Subnet1:
    Type: AWS::EC2::Subnet::Id
    Description: The Main AZ needed to host the Application [ Choose 2 different subnets ]
    MinLength: 1

  Subnet2:
    Type: AWS::EC2::Subnet::Id
    Description: The Main AZ needed to host the Application [ Choose 2 different subnets ]
    MinLength: 1

  DBUsername:
    Type: String
    Description: >
      Master user name. There is no password parameter: RDS generates the
      master password and stores it in Secrets Manager (see the DBSecretArn
      output).

  MultiAZs:
    Type: String
    Default: false
    AllowedValues:
      - false
      - true
    Description: >-
      Create a Multi-AZ deployment. RDS then chooses the zones, so the AZ
      parameter is ignored. SQL Server Express does not support Multi-AZ.

  PublicDB:
    Type: String
    Default: false
    AllowedValues:
      - false
      - true
    Description: Give the instance a publicly resolvable endpoint

  DBEncryption:
    Type: String
    Default: true
    AllowedValues:
      - false
      - true
    Description: >-
      Encrypt the DB storage with the aws/rds KMS key. Changing this replaces
      the DB instance, so a stack created with false must keep false.

  StorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
    Description: >-
      Storage type. Magnetic (standard) storage can no longer be used for new
      DB instances, and io1 needs an Iops value that this template does not set.

  ENVTag:
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
      - Test
    Description: Label Enviroment Tag

  VersionTag:
    Type: String
    Default: V1.0
    Description: Label Version Tag

  ProjectTag:
    Type: String
    Description: Label ProjectTag

Mappings:
  AZIndex:
    A:
      Index: 0
    B:
      Index: 1
    C:
      Index: 2

Conditions:
  IsMultiAZ: !Equals [!Ref MultiAZs, 'true']
  OmitDBName: !Or
    - !Equals [!Ref DB, oracle-se2]
    - !Equals [!Ref DB, sqlserver-ex]

Resources:
  RDS:
    Type: AWS::RDS::DBInstance
    # Keep a final snapshot if the stack deletes or replaces the instance.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AllocatedStorage:
        Ref: AllocatedStorages
      AllowMajorVersionUpgrade: True
      AutoMinorVersionUpgrade: True
      AvailabilityZone: !If
        - IsMultiAZ
        - !Ref AWS::NoValue
        - !Select [!FindInMap [AZIndex, !Ref AZ, Index], !GetAZs '']
      BackupRetentionPeriod: 30
      CopyTagsToSnapshot: True
      DBInstanceClass: !Ref InstanceTypeParameter
      DBInstanceIdentifier:
        Ref: AWS::StackName
      # SQL Server requires DBName to be null, and an Oracle SID is at most
      # 8 characters, so those engines keep their defaults.
      DBName: !If [OmitDBName, !Ref AWS::NoValue, !Ref AWS::StackName]
      DeleteAutomatedBackups: True
      DeletionProtection: True
      Engine:
        Ref: DB
      MasterUsername:
        Ref: DBUsername
      ManageMasterUserPassword: true
      MultiAZ:
        Ref: MultiAZs
      PubliclyAccessible:
        Ref: PublicDB
      SourceRegion:
        Ref: AWS::Region
      StorageEncrypted:
        Ref: DBEncryption
      StorageType:
        Ref: StorageType
      DBSubnetGroupName:
        Ref: SubnetGroup
      Port: "3306"
      VPCSecurityGroups:
        - !Ref RDSSG
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet Group for RDS
      DBSubnetGroupName: !Ref AWS::StackName
      SubnetIds:
        - !Ref Subnet1
        - !Ref Subnet2
      Tags:
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  RDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Basic internet SG for RDS
      GroupName: !Ref AWS::StackName
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1521
          ToPort: 1521
          CidrIp:
            Ref: PrivateIP
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp:
            Ref: PrivateIP
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp:
            Ref: PrivateIP
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp:
            Ref: PrivateIP
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

Outputs:
  DBSecretArn:
    Description: >
      ARN of the Secrets Manager secret in which RDS stores the generated master
      user name and password. Read it with
      aws secretsmanager get-secret-value --secret-id <this ARN>.
    Value: !GetAtt RDS.MasterUserSecret.SecretArn
