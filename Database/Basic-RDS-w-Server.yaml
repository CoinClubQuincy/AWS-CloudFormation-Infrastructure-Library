AWSTemplateFormatVersion: '2010-09-09'
Description: RDS instance plus an EC2 application server in the same VPC.
####  Notes
####  1.When launching RDS to connect you must specify 1 IP in RDS Security Groups
####  2.Enable Public accessibility in modify section


Parameters:
  InstanceTypeParameter2:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
      - t2.large
    Description: Default is t2.micro

  PlacementGroupsetup:
    Type: String
    Default: "spread"
    AllowedValues:
      - "spread"
      - "partition"
      - "cluster"
    Description: "Choose placement group"

  DeploymentGroup:
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
      - Test
    Description: set Deployment Group

  DB:
    Type: String
    Default: MySQL
    AllowedValues:
      - MySQL
      - MariaDB
      - postgres
      - oracle-se2
      - sqlserver-ex
    Description: >-
      RDS engine. oracle-se2 is Oracle Standard Edition Two and sqlserver-ex is
      SQL Server Express. Aurora is not offered because it needs an
      AWS::RDS::DBCluster, which this template does not create.

  PrivateIP:
    Type: String
    Description: private IP for RDS connection

  AllocatedStorages:
    Type: String
    Default: "20"
    AllowedValues:
      - "20"
      - "50"
      - "100"
      - "400"
      - "600"
      - "800"
      - "1000"
    Description: Allocated storage in GiB (gp2 and gp3 need at least 20)

  AZ:
    Type: String
    Default: A
    AllowedValues:
      - A
      - B
      - C
    Description: >-
      Availability Zone for a Single-AZ instance. A, B and C are the first,
      second and third zones that Fn::GetAZs returns for the region. Pick the
      zone of Subnet1 or Subnet2. Ignored when MultiAZs is true.

  InstanceTypeParameter:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
      - db.t3.medium
      - db.t3.large
      - db.t3.xlarge
      - db.t3.2xlarge
      - db.r4.large
      - db.r4.xlarge
      - db.r4.2xlarge
      - db.r4.4xlarge
      - db.r4.8xlarge
      - db.r4.16xlarge
      - db.m4.large
      - db.m4.xlarge
      - db.m4.2xlarge
      - db.m4.4xlarge
      - db.m4.10xlarge
      - db.m4.16xlarge
    Description: Chooses instance type

  VPC:
    Type: AWS::EC2::VPC::Id
    Description: VPC Identifier
    MinLength: 1

  Subnet1:
    Type: AWS::EC2::Subnet::Id
    Description: The Main AZ needed to host the Application [ Choose 2 different subnets ]
    MinLength: 1

  Subnet2:
    Type: AWS::EC2::Subnet::Id
    Description: The Main AZ needed to host the Application [ Choose 2 different subnets ]
    MinLength: 1

  DBUsername:
    Type: String
    Description: >
      Master user name. There is no password parameter: RDS generates the
      master password and stores it in Secrets Manager (see the DBSecretArn
      output).

  MultiAZs:
    Type: String
    Default: false
    AllowedValues:
      - false
      - true
    Description: >-
      Create a Multi-AZ deployment. RDS then chooses the zones, so the AZ
      parameter is ignored. SQL Server Express does not support Multi-AZ.

  PublicDB:
    Type: String
    Default: false
    AllowedValues:
      - false
      - true
    Description: Give the instance a publicly resolvable endpoint

  DBEncryption:
    Type: String
    Default: false
    AllowedValues:
      - false
      - true
    Description: Choose encryption

  StorageType:
    Type: String
    Default: gp3
    AllowedValues:
      - gp3
      - gp2
    Description: >-
      Storage type. Magnetic (standard) storage can no longer be used for new
      DB instances, and io1 needs an Iops value that this template does not set.

  ENVTag:
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
      - Test
    Description: Label Enviroment Tag

  VersionTag:
    Type: String
    Default: V1.0
    Description: Label Version Tag

  ProjectTag:
    Type: String
    Description: Label ProjectTag

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "select key KeyPair"

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Public SSM parameter that holds the AMI ID for the application server,
      resolved in the stack's region. The default is the latest Amazon Linux 2023
      (x86_64). The user data installs Docker with dnf, so it expects AL2023.

Mappings:
  AZIndex:
    A:
      Index: 0
    B:
      Index: 1
    C:
      Index: 2

Conditions:
  IsMultiAZ: !Equals [!Ref MultiAZs, 'true']
  OmitDBName: !Or
    - !Equals [!Ref DB, oracle-se2]
    - !Equals [!Ref DB, sqlserver-ex]

Resources:
  RDS:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage:
        Ref: AllocatedStorages
      AllowMajorVersionUpgrade: True
      AutoMinorVersionUpgrade: True
      AvailabilityZone: !If
        - IsMultiAZ
        - !Ref AWS::NoValue
        - !Select [!FindInMap [AZIndex, !Ref AZ, Index], !GetAZs '']
      BackupRetentionPeriod: 30
      CopyTagsToSnapshot: True
      DBInstanceClass: !Ref InstanceTypeParameter
      DBInstanceIdentifier:
        Ref: AWS::StackName
      # SQL Server requires DBName to be null, and an Oracle SID is at most
      # 8 characters, so those engines keep their defaults.
      DBName: !If [OmitDBName, !Ref AWS::NoValue, !Ref AWS::StackName]
      DeleteAutomatedBackups: True
      DeletionProtection: True
      Engine:
        Ref: DB
      MasterUsername:
        Ref: DBUsername
      ManageMasterUserPassword: true
      MultiAZ:
        Ref: MultiAZs
      PubliclyAccessible:
        Ref: PublicDB
      SourceRegion:
        Ref: AWS::Region
      StorageEncrypted:
        Ref: DBEncryption
      StorageType:
        Ref: StorageType
      DBSubnetGroupName:
        Ref: SubnetGroup
      Port: "3306"
      VPCSecurityGroups:
        - !Ref RDSSG
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet Group for RDS
      DBSubnetGroupName: !Ref AWS::StackName
      SubnetIds:
        - !Ref Subnet1
        - !Ref Subnet2
      Tags:
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  RDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Basic internet SG for RDS
      GroupName: !Ref AWS::StackName
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 1521
          ToPort: 1521
          CidrIp:
            Ref: PrivateIP
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp:
            Ref: PrivateIP
        - IpProtocol: tcp
          FromPort: 1433
          ToPort: 1433
          CidrIp:
            Ref: PrivateIP
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp:
            Ref: PrivateIP
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  WebInstance:
    Type: AWS::EC2::Instance
    Metadata:
        AWS::CloudFormation::Init:
          config:
            files:
              '/etc/profile.d/load_env.sh':
                content: !Sub |
                  export Name=${AWS::StackName}

    Properties:
        InstanceType:
          Ref: InstanceTypeParameter2
        ImageId: !Ref LatestAmiId
        SecurityGroupIds:
          - Ref: InstanceSecurityGroup
        SubnetId:
          Ref: Subnet1
        KeyName:
          Ref: KeyName
        UserData:
          Fn::Base64: |
            #!/bin/bash -xe
            dnf install -y docker
            systemctl enable --now docker
            docker --version

        Tags:
          - Key: Name
            Value: !Ref AWS::StackName
          - Key: DeploymentGroup
            Value:
              Ref: DeploymentGroup
          - Key: ENV
            Value:
              Ref: ENVTag
          - Key: Version
            Value:
              Ref: VersionTag
          - Key: Project
            Value:
              Ref: ProjectTag

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
        GroupDescription: Allow HTTP/HTTPS to ALB
        VpcId:
           Ref: VPC
        SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        Tags:
          - Key: Name
            Value: !Ref AWS::StackName
          - Key: DeploymentGroup
            Value:
              Ref: DeploymentGroup
          - Key: ENV
            Value:
              Ref: ENVTag
          - Key: Version
            Value:
              Ref: VersionTag
          - Key: Project
            Value:
              Ref: ProjectTag

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: True
      HealthCheckIntervalSeconds: 100
      HealthCheckPort: 443
      HealthCheckProtocol: HTTPS
      HealthCheckTimeoutSeconds: 90
      HealthyThresholdCount: 3
      Name: !Ref AWS::StackName
      Port: 443
      Protocol: HTTPS
      Targets:
        - Id:
            Ref: WebInstance
          Port: 443
      TargetType: instance
      VpcId:
        Ref: VPC
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: DeploymentGroup
          Value:
            Ref: DeploymentGroup
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  Loadbalencer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: !Ref AWS::StackName
      Scheme: internet-facing
      SecurityGroups:
        - Ref: InstanceSecurityGroup
      Subnets:
        - Ref: Subnet1
        - Ref: Subnet2
      Type: application
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: DeploymentGroup
          Value:
            Ref: DeploymentGroup
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

  PlacementGroup:
    Type: AWS::EC2::PlacementGroup
    Properties:
      Strategy:
        Ref: PlacementGroupsetup
      Tags:
        - Key: Name
          Value: !Ref AWS::StackName
        - Key: DeploymentGroup
          Value:
            Ref: DeploymentGroup
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag

Outputs:
  DBSecretArn:
    Description: >
      ARN of the Secrets Manager secret in which RDS stores the generated master
      user name and password. Read it with
      aws secretsmanager get-secret-value --secret-id <this ARN>.
    Value: !GetAtt RDS.MasterUserSecret.SecretArn
