AWSTemplateFormatVersion: '2010-09-09'
Description: Security group with parameterised ingress rules.
Parameters:
  VPC:
    Type: AWS::EC2::VPC::Id
    Description: VPC Identifier
    MinLength: 1


  KeyTags:
    Type: String
    Default: Name
    Description: keytags

  PrivateSSMIP:
    Type: String
    Description: >-
      CIDR range allowed to reach the database ports (1521, 3306, 1433 and
      5432), for example 10.0.0.0/16. There is no default.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$'
    ConstraintDescription: must be an IPv4 CIDR block such as 10.0.0.0/16.

  SSHLocation:
    Type: String
    Description: >-
      CIDR range allowed to connect over SSH (port 22), for example
      203.0.113.10/32. There is no default, so SSH is never open to the
      internet unless you ask for 0.0.0.0/0.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$'
    ConstraintDescription: must be an IPv4 CIDR block such as 203.0.113.10/32.


  ENVTag:
    Type: String
    Default: Prod
    AllowedValues:
      - Dev
      - Prod
      - Test
    Description: Label Enviroment Tag

  VersionTag:
    Type: String
    Default: V1.0
    Description: Label Version Tag

  ProjectTag:
    Type: String
    Description: Label ProjectTag


Resources:
  PrivateIP:
    Type: AWS::SSM::Parameter
    Properties:
      Description: Priave IPS that can have acsess to all private instances and DB's
      Name: !Join [ /, [ /RDS,!Ref "AWS::StackName" , IP]]
      Tier: Standard
      Type: String
      Value:
        Ref: PrivateSSMIP


  BasicInternet:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS to ALB
      VpcId:
         Ref: VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: !Ref SSHLocation
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      Tags:
       - Key: !Ref  KeyTags
         Value: !Join
                  - '-'
                  - - ''
                    - !Ref AWS::StackName
                    - "BasicInternetSG"
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

  BasicRDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Basic internet SG for RDS
      GroupName: !Join [ -, [ !Ref "AWS::StackName" ,BasicRDS, SG]]
      VpcId: !Ref VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 1521
        ToPort: 1521
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      - IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      - IpProtocol: tcp
        FromPort: 1433
        ToPort: 1433
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      Tags:
        - Key: !Ref  KeyTags
          Value: !Join
                  - '-'
                  - - ''
                    - !Ref AWS::StackName
                    - "BasicRDSSG"
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag
