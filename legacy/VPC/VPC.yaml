AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Multi-AZ VPC with three public subnets routed to an internet gateway and six
  private subnets that have no route to the internet (the first private route
  table has an S3 gateway endpoint). It also creates a NAT gateway and a route
  table that sends 0.0.0.0/0 to it, but no subnet is associated with that
  table, so the NAT gateway is billed and unused. Also creates three security
  groups, an S3 bucket and four SSM parameters. The subnets span the first three
  Availability Zones that Fn::GetAZs returns, so the region needs at least
  three.
Parameters:
  vpcsize:
    Type: String
    Default: "10.0.0.0/16"
    Description: Pyramid pack V1.0

  ENVTag:
    Type: String
    Default: Dev
    AllowedValues:
      - Dev
      - Prod
      - Test
    Description: Label Enviroment Tag

  VersionTag:
    Type: String
    Default: V.1
    Description: Label Version Tag

  ProjectTag:
    Type: String
    Description: Label ProjectTag

  KeyTags:
    Type: String
    Default: Name
    Description: Label VPC Key Tags

  PrivateSSMIP:
    Type: String
    Description: >-
      CIDR range allowed to reach the database ports (1521, 3306, 1433 and
      5432), for example 10.0.0.0/16. There is no default.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$'
    ConstraintDescription: must be an IPv4 CIDR block such as 10.0.0.0/16.

  SSHLocation:
    Type: String
    Description: >-
      CIDR range allowed to connect over SSH (port 22), for example
      203.0.113.10/32. There is no default, so SSH is never open to the
      internet unless you ask for 0.0.0.0/0.
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/(3[0-2]|[12]?[0-9])$'
    ConstraintDescription: must be an IPv4 CIDR block such as 203.0.113.10/32.


Resources:
##--------------------------Basic VPC Network Layout --------------------------
  myVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref vpcsize
      EnableDnsSupport: 'false'
      EnableDnsHostnames: 'false'
      InstanceTenancy: default
      Tags:
       - Key: !Ref  KeyTags
         Value: !Join
                  - '-'
                  - - ''
                    - !Ref AWS::StackName
                    - "VPC"
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag
##-------------------------- Subnets --------------------------
  privateSub1:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: "10.0.1.0/26"
      MapPublicIpOnLaunch: false
      Tags:
       - Key: !Ref  KeyTags
         Value: !Join
                  - '-'
                  - - 'Database.'
                    - !Ref AWS::StackName
                    - "Private-A"
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag
      VpcId: !Ref myVPC

  privateSub2:
    Type: AWS::EC2::Subnet
