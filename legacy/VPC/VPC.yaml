    Properties:
      RouteTableId:
        Ref: PrivateRouteTable6
      SubnetId:
        Ref: privateSub6


  EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
       - Key: !Ref  KeyTags
         Value: !Ref AWS::StackName
       - Key: DeploymentGroup
         Value: DeploymentGroup

##-------------------------- Gateways & Routes --------------------------

  VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      PrivateDnsEnabled: false
      RouteTableIds:
        - !Ref PrivateRouteTable
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      VpcId:
        Ref: myVPC


  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId:
         Fn::GetAtt:
         - EIP
         - AllocationId
      SubnetId:
        Ref: publicSub1
      Tags:
       - Key: !Ref  KeyTags
         Value: !Ref AWS::StackName
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
       - Key: !Ref  KeyTags
         Value: !Ref AWS::StackName
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId:
         Ref: InternetGateway
      VpcId:
         Ref: myVPC

##-------------------------- Route tables --------------------------

