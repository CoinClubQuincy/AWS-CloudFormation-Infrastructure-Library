       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

##-------------------------- Routes --------------------------

  myRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - InternetGateway
      - AttachGateway
      - RouteTable
    Properties:
       RouteTableId:
         Ref: RouteTable
       DestinationCidrBlock: 0.0.0.0/0
       GatewayId:
         Ref: InternetGateway

  myRoute2:
    Type: AWS::EC2::Route
    DependsOn:
      - InternetGateway
      - AttachGateway
      - RouteTable2
    Properties:
       RouteTableId:
         Ref: RouteTable2
       DestinationCidrBlock: 0.0.0.0/0
       GatewayId:
         Ref: InternetGateway

  myRoute3:
    Type: AWS::EC2::Route
    DependsOn:
      - InternetGateway
      - AttachGateway
      - RouteTable3
    Properties:
       RouteTableId:
         Ref: RouteTable3
       DestinationCidrBlock: 0.0.0.0/0
       GatewayId:
         Ref: InternetGateway

  NATRoute1:
    Type: AWS::EC2::Route
    DependsOn:
      - NatGateway
    Properties:
       RouteTableId:
         Ref: NATRouteTable
       DestinationCidrBlock: 0.0.0.0/0
       NatGatewayId:
         Ref: NatGateway

##-------------------------- SSM Parameter Store --------------------------


  PrivateIP:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ /, [ /RDS,!Ref "AWS::StackName" , IP]]
      Tier: Standard
      Type: String
      Value:
        Ref: PrivateSSMIP

  GitHubOAuthToken:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ /, [ /GitHubOAuthToken,!Ref "AWS::StackName"]]
      Tier: Standard
      Type: String
      Value: None

  GitHubOwner:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ /, [ /GitHubOwner,!Ref "AWS::StackName"]]
      Tier: Standard
      Type: String
      Value: None

  GitHubSecret:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ /, [ /GitHubSecret,!Ref "AWS::StackName"]]
      Tier: Standard
      Type: String
      Value: None

##-------------------------- Security Groups & NACLs --------------------------
  BasicInternet:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP/HTTPS to ALB
      VpcId:
         Ref: myVPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: !Ref SSHLocation
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      Tags:
       - Key: !Ref  KeyTags
         Value: !Join
                  - '-'
                  - - ''
                    - !Ref AWS::StackName
                    - "BasicInternetSG"
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

  BasicRDSSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Basic internet SG for RDS
      GroupName: !Join [ -, [ !Ref "AWS::StackName" ,BasicRDS, SG]]
      VpcId:
        Ref: myVPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 1521
        ToPort: 1521
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      - IpProtocol: tcp
        FromPort: 3306
        ToPort: 3306
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      - IpProtocol: tcp
        FromPort: 1433
        ToPort: 1433
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp:
          Fn::GetAtt: [ PrivateIP, Value ]
      Tags:
        - Key: !Ref  KeyTags
          Value: !Join
                  - '-'
                  - - ''
                    - !Ref AWS::StackName
                    - "BasicRDSSG"
        - Key: ENV
          Value:
            Ref: ENVTag
        - Key: Version
          Value:
            Ref: VersionTag
        - Key: Project
          Value:
            Ref: ProjectTag


  SSH:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Basic internet SG for private VPC
      GroupName: SSH-SG
      VpcId:
        Ref: myVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation
      Tags:
       - Key: !Ref  KeyTags
         Value: !Ref AWS::StackName
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

##-------------------------- S3 --------------------------
  NestedPack:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Join [ -, [ !Ref "AWS::StackName", pyramidpack,xx-nestedcloudformation-xx] ]
      Tags:
       - Key: !Ref  KeyTags
         Value: !Ref AWS::StackName
       - Key: ENV
         Value:
           Ref: ENVTag
       - Key: Version
         Value:
           Ref: VersionTag
       - Key: Project
         Value:
           Ref: ProjectTag

##-------------------------- Outputs --------------------------
Outputs:
  VPC:
    Description: VPC
    Value:
      Ref: myVPC
    Export:
      Name: !Ref AWS::StackName

  PS1:
    Description: Private sub 1
    Value:
      Ref: privateSub1
    Export:
      Name: !Join [ -, [ !Ref "AWS::StackName", First-Privatesubnet] ]

  PS2:
    Description: Private sub 2
